[project]
name = "webpresenter-worker"
version = "0.1.0"
description = "Processing worker for webpresenter: YouTube import (yt-dlp) and vocal separation (Demucs)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pika==1.3.2",
    "requests==2.32.5",
    "yt-dlp[default]>=2025.11.12",  # YouTube changes often: keep yt-dlp current
]

[project.optional-dependencies]
# Vocal separation. On machines without an NVIDIA GPU install the CPU build of PyTorch first:
#   pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
separation = [
    "demucs==4.0.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "soundfile==0.13.1",
]

[project.scripts]
webpresenter-worker = "webpresenter_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["webpresenter_worker"]
