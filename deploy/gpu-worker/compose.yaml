# Processing worker on a computer with an NVIDIA GPU (separation, lyrics recognition), connected to
# the main server through a VPN. The main server runs the relay (deploy/compose.prod.yaml, profile
# remote-workers) on its VPN address; see README.md.
name: webpresenter-gpu

services:
  worker:
    build:
      context: ../../worker
      args:
        TORCH_INDEX: cu124
    image: webpresenter-worker-gpu:latest
    restart: unless-stopped
    # The NVIDIA runtime gives the unprivileged worker user access to the GPU (with "gpus: all" the
    # device nodes may belong to a group it is not in).
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RABBITMQ_URL: amqp://webpresenter:${RABBITMQ_PASSWORD:?}@${SERVER_VPN_ADDRESS:?}:${RELAY_AMQP_PORT:-5672}/%2F
      # Work links name the media store as the main server sees it; they go to the relay instead.
      MEDIA_STORE_ADDRESS: http://${SERVER_VPN_ADDRESS:?}:${RELAY_S3_PORT:-8333}
      DEMUCS_DEVICE: cuda
      # Seconds of audio per Demucs chunk: lower uses less GPU memory (4 GB cards need a smaller one).
      DEMUCS_SEGMENT: ${DEMUCS_SEGMENT:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      JOB_KINDS: ${JOB_KINDS:-all}
    volumes:
      - models:/models

volumes:
  models:
