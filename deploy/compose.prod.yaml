# Production stack, independent of this computer's LAN address: the beacon announces it (mDNS name
# PUBLIC_NAME, e.g. webpresenter.local, and UDP broadcasts MediaPlayers listen to). Browsers use
# https://PUBLIC_NAME[:PUBLIC_PORT] (local CA, see docs/deployment.md) or any address of this
# computer; MediaPlayers find the server by themselves (or use --server-url).
# Configure deploy/.env.prod (see .env.prod.example), build with
# deploy/build-prod.sh, then:
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.prod up -d
# Replication to another SeaweedFS: add `--profile replication` (see docs/deployment.md).
name: webpresenter-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webpresenter
      POSTGRES_USER: webpresenter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webpresenter -d webpresenter"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-relative-path=/auth
      # No fixed hostname: Keycloak names itself after the address each browser used (LAN
      # addresses change); the server accepts tokens of this realm on any host.
      - --hostname-strict=false
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      # Placeholders used by the realm import.
      WEBPRESENTER_ADMIN_USER: ${WEBPRESENTER_ADMIN_USER:?set WEBPRESENTER_ADMIN_USER}
      WEBPRESENTER_ADMIN_PASSWORD: ${WEBPRESENTER_ADMIN_PASSWORD:?set WEBPRESENTER_ADMIN_PASSWORD}
      WEBPRESENTER_ADMIN_EMAIL: ${WEBPRESENTER_ADMIN_EMAIL:-admin@webpresenter.local}
    volumes:
      - ./prod/webpresenter-realm.json:/opt/keycloak/data/import/webpresenter-realm.json:ro
    ports:
      # Only for the proxy, which runs on the host network.
      - "127.0.0.1:${KEYCLOAK_LOCAL_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - seaweedfs-data:/data
      - ./prod/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    ports:
      # Media is downloaded through the proxy (/s3/…), which reaches S3 on the loopback.
      - "127.0.0.1:${S3_LOCAL_PORT:-18333}:8333"
      # Filer HTTP and gRPC: used by the replica's filer.sync.
      - "${FILER_PORT:-8888}:8888"
      - "${FILER_GRPC_PORT:-18888}:18888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    image: webpresenter-server:latest
    restart: unless-stopped
    ports:
      # Only for the proxy, which runs on the host network.
      - "127.0.0.1:${SERVER_LOCAL_PORT:-18090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WEBPRESENTER_DB_URL: jdbc:postgresql://postgres:5432/webpresenter
      WEBPRESENTER_DB_USER: webpresenter
      WEBPRESENTER_DB_PASSWORD: ${DB_PASSWORD}
      WEBPRESENTER_OIDC_JWKS: http://keycloak:8080/auth/realms/webpresenter/protocol/openid-connect/certs
      WEBPRESENTER_S3_ENDPOINT: http://seaweedfs:8333
      # Links for browsers and players are relative (/s3/…) and go through the proxy, which
      # forwards them with this host: they work whatever address the client used.
      WEBPRESENTER_S3_PUBLIC_ENDPOINT: http://webpresenter-s3
      WEBPRESENTER_S3_PLAYER_ENDPOINT: http://webpresenter-s3
      WEBPRESENTER_S3_LINK_PREFIX: /s3
      WEBPRESENTER_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WEBPRESENTER_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WEBPRESENTER_S3_BUCKET: media
      WEBPRESENTER_RABBITMQ_HOST: rabbitmq
      WEBPRESENTER_RABBITMQ_USER: webpresenter
      WEBPRESENTER_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  rabbitmq:
    # Job queue between the server and the workers. Published on the loopback only, for the relay.
    image: rabbitmq:4.1.4-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AMQP_LOCAL_PORT:-18672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: webpresenter
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    # YouTube import and Demucs vocal separation (CPU). Reaches S3 through presigned links at the
    # server's internal address (http://seaweedfs:8333). Scale with --scale worker=2.
    build:
      context: ../worker
    image: webpresenter-worker:latest
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://webpresenter:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      # With a GPU worker (deploy/gpu-worker), heavy jobs wait this long for it before this CPU
      # worker takes them (0: at once).
      HEAVY_JOBS_AFTER: ${CPU_HEAVY_JOBS_AFTER:-0}
    volumes:
      - worker-models:/models
    depends_on:
      rabbitmq:
        condition: service_healthy

  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Host network: it sees which of this computer's addresses a client connected to, so the
    # certificate is issued for that address (browsers opening https://<IP>:PUBLIC_PORT get no
    # warning once the local CA is trusted), whatever the current address is.
    network_mode: host
    environment:
      PUBLIC_NAME: ${PUBLIC_NAME:-webpresenter.local}
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
      PLAYER_PORT: ${PLAYER_PORT:-80}
      SERVER_LOCAL: 127.0.0.1:${SERVER_LOCAL_PORT:-18090}
      KEYCLOAK_LOCAL: 127.0.0.1:${KEYCLOAK_LOCAL_PORT:-18080}
      S3_LOCAL: 127.0.0.1:${S3_LOCAL_PORT:-18333}
    volumes:
      - ./prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./prod/landing.html:/srv/landing.html:ro
      - caddy-data:/data
    depends_on:
      - server
      - keycloak

  # Workers on other computers (a GPU machine, deploy/gpu-worker) reach the job queue and the media
  # store through this relay, on the VPN address only. Enabled with --profile remote-workers.
  relay:
    profiles: ["remote-workers"]
    build:
      context: ./relay
    image: webpresenter-relay:latest
    restart: unless-stopped
    network_mode: host
    environment:
      RELAY_ADDRESS: ${RELAY_ADDRESS:-}
      AMQP_LOCAL_PORT: ${AMQP_LOCAL_PORT:-18672}
      S3_LOCAL_PORT: ${S3_LOCAL_PORT:-18333}
    depends_on:
      - rabbitmq
      - seaweedfs

  # Announces this computer on the LAN, whatever its current address: the mDNS name PUBLIC_NAME
  # (browsers) and UDP broadcasts on BEACON_PORT that MediaPlayers listen to. Host networking:
  # it must see the real interfaces.
  beacon:
    build:
      context: ./beacon
    image: webpresenter-beacon:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_NAME: ${PUBLIC_NAME:-webpresenter.local}
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
      PLAYER_PORT: ${PLAYER_PORT:-80}
      BEACON_PORT: ${BEACON_PORT:-47800}

  # Live bidirectional replication with another SeaweedFS (e.g. the church computer).
  replication:
    profiles: ["replication"]
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command:
      - filer.sync
      - -a=seaweedfs:8888
      # Required when this profile is used: host:port of the other filer.
      - -b=${REPLICA_FILER:-unset-replica-filer:8888}
      # Chunks travel through the filers, so only the filer ports must be reachable.
      - -a.filerProxy
      - -b.filerProxy
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  caddy-data:
  rabbitmq-data:
  worker-models:
