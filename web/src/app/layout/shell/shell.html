<mat-toolbar class="toolbar">
  <span class="brand">webpresenter</span>
  <nav class="nav">
    <a mat-button routerLink="/ao-vivo" routerLinkActive="active" aria-label="Ao vivo">
      <mat-icon>live_tv</mat-icon>
      <span class="nav-label">Ao vivo</span>
    </a>
    <a mat-button routerLink="/eventos" routerLinkActive="active" aria-label="Eventos">
      <mat-icon>event_list</mat-icon>
      <span class="nav-label">Eventos</span>
    </a>
    <a mat-button routerLink="/musicas" routerLinkActive="active" aria-label="Músicas">
      <mat-icon>queue_music</mat-icon>
      <span class="nav-label">Músicas</span>
    </a>
    <a mat-button routerLink="/biblioteca" routerLinkActive="active" aria-label="Biblioteca">
      <mat-icon>video_library</mat-icon>
      <span class="nav-label">Biblioteca</span>
    </a>
    @if (currentUser.canManageDevices()) {
      <a mat-button routerLink="/dispositivos" routerLinkActive="active" aria-label="Dispositivos">
        <mat-icon>connected_tv</mat-icon>
        <span class="nav-label">Dispositivos</span>
      </a>
    }
  </nav>
  <span class="spacer"></span>
  @if (currentUser.user()) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user" [attr.aria-label]="currentUser.displayName()">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ currentUser.displayName() }}</span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <div mat-menu-item disabled>
        <div class="menu-user">
          <span>{{ currentUser.displayName() }}</span>
          <span class="roles">{{ currentUser.roleLabels().join(', ') }}</span>
        </div>
      </div>
      <button mat-menu-item (click)="currentUser.changePassword()">
        <mat-icon>password</mat-icon>
        Trocar senha
      </button>
      <button mat-menu-item (click)="currentUser.openAccount()">
        <mat-icon>manage_accounts</mat-icon>
        Minha conta
      </button>
      <button mat-menu-item (click)="currentUser.logout()">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </mat-menu>
  }
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
