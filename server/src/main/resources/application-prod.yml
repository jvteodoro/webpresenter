# Production profile: behind the reverse proxy, on the same origin as the web app and Keycloak (/auth).
server:
  forward-headers-strategy: framework

webpresenter:
  oidc:
    # Keycloak names itself after the address the browser used (the LAN address may change):
    # tokens are accepted for this realm path on any host, signed with keys fetched internally.
    issuer-path: /auth/realms/webpresenter
    jwk-set-uri: ${WEBPRESENTER_OIDC_JWKS}
  cors:
    # Same origin in production.
    allowed-origins: ${WEBPRESENTER_CORS_ORIGINS:}
